name: Build Release AAB (Play Store)

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'versionCode (inteiro, precisa ser maior que o último publicado na Play Store)'
        required: true
        default: '1'
      versionName:
        description: 'versionName visível para o usuário (ex.: 1.0.0)'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & assinar Android App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependências
        run: npm install

      - name: Criar arquivo .env
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Build web (Vite)
        run: npm run build

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Permissão no gradlew
        run: chmod +x android/gradlew

      - name: Forçar versões corretas do Gradle e AGP
        run: |
          # Garantir que os diretórios existam
          mkdir -p android/gradle/wrapper

          # Reescrever gradle-wrapper.properties para a versão 8.11.1
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'PROPS'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-all.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPS

          # Reescrever variables.gradle com compileSdk 36 (exigido pela biblioteca Health Connect)
          cat > android/variables.gradle << 'VARS'
          ext {
              minSdkVersion = 26
              compileSdkVersion = 36
              targetSdkVersion = 36
              androidxActivityVersion = '1.9.3'
              androidxAppCompatVersion = '1.7.0'
              androidxCoordinatorLayoutVersion = '1.2.0'
              androidxCoreVersion = '1.15.0'
              androidxFragmentVersion = '1.8.5'
              coreSplashScreenVersion = '1.0.1'
              androidxWebkitVersion = '1.12.1'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.2.1'
              androidxEspressoCoreVersion = '3.6.1'
              cordovaAndroidVersion = '10.1.1'
          }
          VARS

          # Adicionar supressão de aviso para SDK 36 no gradle.properties
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

          echo "✅ Configurações atualizadas para AGP 8.9.1 e SDK 36"

      - name: Definir versionCode / versionName
        run: |
          VERSION_CODE="${{ github.event.inputs.versionCode || '1' }}"
          VERSION_NAME="${{ github.event.inputs.versionName || '1.0.0' }}"
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          echo "versionCode=${VERSION_CODE} / versionName=${VERSION_NAME}"

      - name: Restaurar keystore de assinatura
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "❌ Secret ANDROID_KEYSTORE_BASE64 não configurado. Veja docs/PLAY_STORE_CHECKLIST.md." >&2
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/keystore.properties << EOF
          storeFile=app/upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build Android App Bundle (release, assinado)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"
          JAVA_TOOL_OPTIONS: "-Xmx2048m"

      - name: Upload AAB assinado
        uses: actions/upload-artifact@v4
        with:
          name: BoxLink-release-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Limpar keystore do runner
        if: always()
        run: rm -f android/app/upload-keystore.jks android/keystore.properties
